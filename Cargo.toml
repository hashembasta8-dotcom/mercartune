[package]
name = "mericartune"
version = "0.1.0"
edition = "2021"
description = "Free & Open Source ECU Tuning Suite for American Cars - GM LS/LT, Ford, Dodge"
authors = ["AmericarTune Contributors"]
license = "Apache-2.0"
repository = "https://github.com/mericartune/mericartune"
readme = "README.md"
keywords = ["ecu", "tuning", "automotive", "gm", "ford", "dodge"]
categories = ["command-line-utilities", "hardware-support", "development-tools::build-utils"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# ECU parsing
hex = "0.4"
memmap2 = "0.9"

# CLI
colored = "2"
dialoguer = "0.11"

[features]
default = []
ai = []
cloud = ["reqwest"]

[profile.release]
opt-level = 3
lto = true
strip = true
